<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --bg-gradient: linear-gradient(135deg, #1f2937 0%, #111827 100%);
  --glass-bg: rgba(255, 255, 255, 0.07);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-hover: rgba(255, 255, 255, 0.15);
  --text-main: #f9fafb;
  --text-sec: #9ca3af;
  --accent: #3b82f6; /* Blue */
  --accent-glow: rgba(59, 130, 246, 0.5);
  --pos: #10b981; /* Green */
  --neg: #ef4444; /* Red */
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg-gradient);
  color: var(--text-main);
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* --- Header --- */
header {
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--glass-border);
  padding: 15px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
}

.brand h1 {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 700;
  background: linear-gradient(to right, #60a5fa, #a78bfa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

/* Inputs & Buttons */
select, input[type="date"], button {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid var(--glass-border);
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(1);
}

button:hover, select:hover, input:hover {
  background: var(--glass-hover);
  border-color: rgba(255,255,255,0.3);
}

.btn-pri {
  background: var(--accent);
  border: none;
  font-weight: 600;
  box-shadow: 0 0 15px var(--accent-glow);
}
.btn-pri:hover {
  background: #2563eb;
  transform: translateY(-1px);
}

/* --- Main Layout --- */
main {
  flex: 1;
  display: flex;
  padding: 20px;
  gap: 20px;
  overflow: hidden;
}

/* Glass Card Container */
.card {
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
}

.heatmap-section {
  flex: 1;
  padding: 20px;
  overflow: hidden;
}

.sidebar {
  width: 320px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}
.card-head h2 { font-size: 1.1rem; margin: 0; color: var(--text-main); }
.legend { font-size: 0.8rem; color: var(--text-sec); display: flex; gap: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.pos { background: var(--pos); box-shadow: 0 0 8px var(--pos); }
.dot.neg { background: var(--neg); box-shadow: 0 0 8px var(--neg); }

/* --- Grid --- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
  gap: 8px;
  overflow-y: auto;
  padding-right: 5px;
  flex: 1;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

.cell {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  padding: 10px 5px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.1s, background 0.2s;
}

.cell:hover {
  transform: scale(1.05);
  z-index: 5;
  border-color: rgba(255,255,255,0.4);
}

.c-time { font-size: 0.7rem; color: var(--text-sec); display: block; margin-bottom: 4px; }
.c-val { font-size: 1.1rem; font-weight: 700; }

.bg-pos { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3); color: #6ee7b7; }
.bg-neg { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: #fca5a5; }

/* --- Sidebar --- */
.kpi-row {
  display: flex;
  gap: 10px;
}
.kpi-box {
  flex: 1;
  text-align: center;
  padding: 15px;
}
.kpi-val { font-size: 1.8rem; font-weight: 700; margin: 5px 0; }
.kpi-val.pos { color: #6ee7b7; text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
.kpi-val.neg { color: #fca5a5; text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
.kpi-box small { color: var(--text-sec); font-size: 0.75rem; }

.log-box {
  flex: 1;
  padding: 15px;
  overflow-y: hidden;
  display: flex;
  flex-direction: column;
}
.log-list {
  list-style: none;
  padding: 0;
  margin: 0;
  overflow-y: auto;
  flex: 1;
}
.log-list li {
  padding: 10px;
  border-bottom: 1px solid var(--glass-border);
  font-size: 0.85rem;
  display: flex;
  justify-content: space-between;
}
.log-list li:last-child { border: none; }
.badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); }

/* --- Modal --- */
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(4px);
  z-index: 50; display: none;
}
.modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: #1f2937; /* Solid dark for readability over glass */
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 25px;
  z-index: 60;
  width: 500px;
  display: none;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  color: white;
}
.modal h2 { margin-top: 0; }
textarea { 
  width: 100%; height: 100px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); 
  color: white; border-radius: 6px; padding: 10px; box-sizing: border-box; 
}
.agent-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.agent-table th { text-align: left; border-bottom: 1px solid var(--glass-border); padding: 8px; color: var(--text-sec); }
.agent-table td { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px; }
.btn-sm { padding: 4px 10px; font-size: 0.75rem; background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
.btn-sm:hover { background: rgba(239, 68, 68, 0.4); }

/* Loader */
.loader { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index: 99; display:none; justify-content: center; align-items: center; color: white; flex-direction: column; backdrop-filter: blur(5px); }
.spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s infinite linear; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

</style>
