<script>
const app = {
  selectedDate: '',
  
  init: function() {
    const t = new Date();
    const local = new Date(t.getTime() - (t.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
    document.getElementById('datePicker').value = local;
    app.load();
  },

  load: function() {
    this.selectedDate = document.getElementById('datePicker').value;
    if(!this.selectedDate) return;
    ui.showLoader(true);
    google.script.run
      .withSuccessHandler(this.renderHeatmap)
      .withFailureHandler(ui.handleError)
      .getHeatmapData(this.selectedDate);
  },

  renderHeatmap: function(data) {
    ui.showLoader(false);
    if(data.rotation) document.getElementById('rotPicker').value = data.rotation;
    
    // --- 1. RENDER GRID ---
    const grid = document.getElementById('heatmapGrid');
    grid.innerHTML = '';
    
    let maxS = 0, maxR = 0;
    
    data.grid.forEach((b, i) => {
      // Logic for Max/Min
      if(b.net > maxS) maxS = b.net;
      if(b.net < maxR) maxR = b.net;

      // THRESHOLD LOGIC (Updated)
      // > 3 : Green (Surplus)
      // <= 0 : Red (Risk)
      // 1-3 : Neutral
      let cls = 'status-neutral'; 
      if(b.net > 3) cls = 'status-surplus';
      if(b.net <= 0) cls = 'status-risk';
      
      const d = document.createElement('div');
      d.className = `h-14 rounded-lg flex flex-col items-center justify-center cursor-pointer transition-all ${cls} cell-anim`;
      d.style.animationDelay = `${i * 0.005}s`;
      d.onclick = () => app.openSlot(b.index);
      
      d.innerHTML = `
        <span class="text-[10px] opacity-70 mb-0.5">${b.label}</span>
        <span class="text-sm font-bold">${b.net > 0 ? '+'+b.net : b.net}</span>
      `;
      grid.appendChild(d);
    });

    // --- 2. UPDATE KPIs ---
    // If surplus is really high (>15 implied), text glows more? 
    // Standardizing text color based on your classes
    const kpiS = document.getElementById('kpi-surplus');
    kpiS.innerText = (maxS > 0 ? '+' : '') + maxS;
    kpiS.className = "text-3xl font-bold tracking-tight glow-text " + (maxS > 3 ? "text-emerald-400" : "text-white");

    const kpiR = document.getElementById('kpi-risk');
    kpiR.innerText = maxR;
    kpiR.className = "text-3xl font-bold tracking-tight glow-text " + (maxR <= 0 ? "text-red-400" : "text-white");

    // --- 3. RENDER ACTIVITY LOG ---
    const list = document.getElementById('activityList');
    list.innerHTML = '';
    
    if (data.furloughs.length === 0) {
      list.innerHTML = `
        <div class="flex flex-col items-center justify-center h-40 text-slate-500">
           <span class="material-symbols-outlined text-4xl mb-2 opacity-20">history_toggle_off</span>
           <p class="text-sm">No furlough activity recorded</p>
        </div>`;
    } else {
      data.furloughs.forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'flex gap-3 p-3 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-colors cursor-default cell-anim';
        div.style.animationDelay = `${idx * 0.05}s`;
        
        // Icon based on rotation or random
        let iconColor = "text-blue-400";
        let iconBg = "bg-blue-500/20";
        let iconBorder = "border-blue-500/30";
        let icon = "person";

        div.innerHTML = `
          <div class="w-8 h-8 rounded-full ${iconBg} border ${iconBorder} flex items-center justify-center flex-shrink-0">
             <span class="material-symbols-outlined text-[16px] ${iconColor}">${icon}</span>
          </div>
          <div class="flex-1">
             <div class="flex justify-between items-start mb-0.5">
                <p class="text-sm text-slate-200 font-medium">${f.agent}</p>
                <span class="text-[10px] text-slate-500 font-medium whitespace-nowrap">${f.time}</span>
             </div>
             <div class="flex justify-between items-end">
                <p class="text-xs text-slate-500">${f.rotation}</p>
                <p class="text-xs text-emerald-300 font-medium bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">Saved: ${f.hours}h</p>
             </div>
          </div>
        `;
        list.appendChild(div);
      });
    }
    
    // Update Totals Footer
    if(data.totals) {
      document.getElementById('stat-day').innerText = data.totals.day.toFixed(2) + 'h';
    }
  },

  openSlot: function(idx) {
    ui.showLoader(true);
    google.script.run
      .withSuccessHandler(ui.showSlotModal)
      .getBucketDetails(this.selectedDate, idx);
  },
  
  submitFurlough: function(agentName, startId, endId) {
    const sVal = document.getElementById(startId).value;
    const eVal = document.getElementById(endId).value;
    
    if(!sVal || !eVal) return alert("Enter Start/End times.");
    
    ui.showLoader(true);
    google.script.run
      .withSuccessHandler((res) => {
        ui.closeModals();
        app.load();
      })
      .submitFurlough(agentName, this.selectedDate, sVal, eVal);
  },

  setRotation: function() {
    const val = document.getElementById('rotPicker').value;
    google.script.run.setRotation(val);
  },

  runImport: function() {
    const s = document.getElementById('txtSched').value;
    const i = document.getElementById('txtIDP').value;
    ui.showLoader(true);
    
    google.script.run
      .withSuccessHandler(res => {
        alert(res);
        ui.closeModals();
        ui.showLoader(false);
        app.load();
      })
      .withFailureHandler(ui.handleError)
      .importRawData(s, i);
  }
};

const ui = {
  openImport: () => {
    document.getElementById('modalImport').classList.remove('hidden');
  },
  
  closeModals: () => {
    document.querySelectorAll('[id^="modal"]').forEach(m => m.classList.add('hidden'));
  },
  
  showLoader: (vis) => {
    const l = document.getElementById('loader');
    vis ? l.classList.remove('hidden') : l.classList.add('hidden');
  },
  
  handleError: (e) => {
    ui.showLoader(false);
    alert('Error: ' + e.message);
  },
  
  showSlotModal: (data) => {
    ui.showLoader(false);
    document.getElementById('slotTitle').innerText = `${data.time} Staffing`;
    
    const tbody = document.getElementById('agentList');
    tbody.innerHTML = '';
    
    if(data.agents.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="p-6 text-center text-slate-500">No agents available</td></tr>';
    } else {
      data.agents.forEach((a, i) => {
         const tr = document.createElement('tr');
         const sId = `start_${i}`;
         const eId = `end_${i}`;
         
         tr.innerHTML = `
           <td class="p-4 font-medium text-white">${a.name}</td>
           <td class="p-4 text-slate-400">${a.shiftStart} - ${a.shiftEnd}</td>
           <td class="p-4">
             <div class="flex items-center gap-2">
               <input type="time" id="${sId}" value="${data.time}" class="bg-slate-800 border-none rounded text-xs p-1 text-white focus:ring-1 ring-primary">
               <span class="text-slate-600">to</span>
               <input type="time" id="${eId}" value="${a.shiftEnd}" class="bg-slate-800 border-none rounded text-xs p-1 text-white focus:ring-1 ring-primary">
             </div>
           </td>
           <td class="p-4 text-right">
             <button class="glass-button-primary px-3 py-1 rounded text-xs font-bold" onclick="app.submitFurlough('${a.name}', '${sId}', '${eId}')">Apply</button>
           </td>
         `;
         tbody.appendChild(tr);
      });
    }

    document.getElementById('modalSlot').classList.remove('hidden');
  }
};

window.onload = app.init;
</script>
