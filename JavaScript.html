<script>
const app = {
  
  init: function() {
    const t = new Date();
    const local = new Date(t.getTime() - (t.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
    document.getElementById('datePicker').value = local;
    app.load();
  },

  load: function() {
    const date = document.getElementById('datePicker').value;
    const mode = document.getElementById('viewPicker').value;
    if(!date) return;
    
    ui.showLoader(true);
    google.script.run
      .withSuccessHandler(this.renderDashboard)
      .withFailureHandler(ui.handleError)
      .getAnalyticsData(mode, date);
  },

  renderDashboard: function(data) {
    ui.showLoader(false);
    
    document.getElementById('gridTitle').innerText = data.label;
    document.getElementById('gridSub').innerText = data.mode === 'day' ? "Intraday Intervals" : "Aggregated View";
    
    const grid = document.getElementById('heatmapGrid');
    const ph = document.getElementById('rangePlaceholder');
    const legend = document.getElementById('gridLegend');
    
    grid.innerHTML = '';
    
    if (data.mode === 'day') {
       grid.classList.remove('hidden');
       ph.classList.add('hidden');
       legend.classList.remove('hidden');
       
       data.grid.forEach((b, i) => {
          let cls = 'status-neutral'; 
          if(b.net > 3) cls = 'status-surplus';
          if(b.net <= 0) cls = 'status-risk';
          
          const d = document.createElement('div');
          d.className = `heatmap-cell h-[60px] animate-enter ${cls}`;
          d.style.animationDelay = `${i * 0.005}s`;
          // ADDED CLICK EVENT HERE
          d.setAttribute('onclick', `app.openBucket(${b.index})`);
          
          d.innerHTML = `
            <span class="text-[10px] opacity-60 mb-0.5 font-medium">${b.label}</span>
            <span class="text-sm font-bold font-sf">${b.net > 0 ? '+'+b.net : b.net}</span>
          `;
          grid.appendChild(d);
       });
    } else {
       grid.classList.add('hidden');
       ph.classList.remove('hidden');
       legend.classList.add('hidden');
    }

    document.getElementById('stat-total').innerText = data.totals.all.toFixed(2) + 'h';
    document.getElementById('stat-count').innerText = data.totals.count;
    document.getElementById('stat-morning').innerText = data.totals.morning.toFixed(2) + 'h';
    document.getElementById('stat-evening').innerText = data.totals.evening.toFixed(2) + 'h';
    document.getElementById('stat-night').innerText = data.totals.night.toFixed(2) + 'h';

    const list = document.getElementById('activityList');
    list.innerHTML = '';
    
    if (data.furloughs.length === 0) {
      list.innerHTML = `<div class="flex flex-col items-center justify-center h-40 text-sec"><span class="material-symbols-outlined text-4xl mb-2 opacity-20">history_toggle_off</span><p class="text-sm">No activity found</p></div>`;
    } else {
      data.furloughs.forEach((f, idx) => {
        const div = document.createElement('div');
        div.className = 'flex gap-3 p-3 rounded-xl bg-[var(--item-hover)] border border-[var(--glass-border)] animate-enter';
        div.style.animationDelay = `${idx * 0.03}s`;
        
        let badgeColor = "bg-slate-500/10 text-slate-400";
        if(f.shift === 'Morning') badgeColor = "bg-yellow-500/10 text-yellow-500";
        if(f.shift === 'Evening') badgeColor = "bg-orange-500/10 text-orange-500";
        if(f.shift === 'Night') badgeColor = "bg-indigo-500/10 text-indigo-500";

        div.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-[var(--glass-panel)] flex items-center justify-center flex-shrink-0 border border-[var(--glass-border)]">
             <span class="material-symbols-outlined text-[16px] text-sec">person</span>
          </div>
          <div class="flex-1 min-w-0">
             <div class="flex justify-between items-start mb-1">
                <p class="text-sm font-medium truncate pr-2">${f.agent}</p>
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${badgeColor}">${f.shift}</span>
             </div>
             <div class="flex justify-between items-end">
                <div class="flex flex-col">
                   <span class="text-[10px] text-sec">${f.date}</span>
                   <span class="text-xs font-mono opacity-80">${f.time}</span>
                </div>
                <p class="text-sm text-[#0A84FF] font-bold font-sf">${f.hours}h</p>
             </div>
          </div>
        `;
        list.appendChild(div);
      });
    }
  },

  // NEW: OPEN BUCKET / FURLOUGH MODAL LOGIC
  openBucket: function(idx) {
    const date = document.getElementById('datePicker').value;
    ui.showLoader(true);
    
    google.script.run
      .withSuccessHandler(res => {
         ui.showLoader(false);
         document.getElementById('bucketTimeTitle').innerText = res.time;
         
         const list = document.getElementById('bucketAgentList');
         const select = document.getElementById('furloughAgent');
         list.innerHTML = '';
         select.innerHTML = '<option value="">Select Agent...</option>';

         if(res.agents.length === 0) {
            list.innerHTML = '<p class="text-xs text-sec text-center py-4 italic">No productive agents on shift.</p>';
         } else {
            res.agents.forEach(a => {
               // Populate Agent List
               list.innerHTML += `<div class="flex justify-between items-center p-2 rounded bg-[var(--item-hover)]">
                 <span class="text-sm font-medium text-primary truncate max-w-[150px]">${a.name}</span>
                 <span class="text-[10px] text-sec">${a.activity} (${a.shiftStart} - ${a.shiftEnd})</span>
               </div>`;
               // Populate Dropdown
               select.innerHTML += `<option value="${a.name}">${a.name}</option>`;
            });
         }
         
         // Auto-fill the start time to match the bucket clicked
         const timeParts = res.time.split(':');
         document.getElementById('furloughStart').value = `${timeParts[0].padStart(2, '0')}:${timeParts[1].padStart(2, '0')}`;
         document.getElementById('furloughEnd').value = '';
         
         document.getElementById('modalBucket').classList.remove('hidden');
      })
      .withFailureHandler(ui.handleError)
      .getBucketDetails(date, idx);
  },

  // NEW: SUBMIT FURLOUGH TO DB
  submitFurlough: function() {
    const agent = document.getElementById('furloughAgent').value;
    const start = document.getElementById('furloughStart').value;
    const end = document.getElementById('furloughEnd').value;
    const date = document.getElementById('datePicker').value;

    if(!agent || !start) {
        alert("Agent and Start Time are required.");
        return;
    }

    ui.showLoader(true);
    google.script.run
      .withSuccessHandler(res => {
         ui.showLoader(false);
         if(res.includes('Error')) {
             alert(res);
         } else {
             ui.closeModals();
             app.load(); // Refresh grid to deduct supply
         }
      })
      .withFailureHandler(ui.handleError)
      .submitFurlough(agent, date, start, end);
  },

  runImport: function() {
    const s = document.getElementById('txtSched').value;
    const i = document.getElementById('txtIDP').value;
    ui.showLoader(true);
    google.script.run
      .withSuccessHandler(res => {
        alert(res);
        ui.closeModals();
        ui.showLoader(false);
        app.load();
      })
      .withFailureHandler(ui.handleError)
      .importRawData(s, i);
  }
};

const ui = {
  toggleTheme: () => {
    const html = document.documentElement;
    const isDark = !html.getAttribute('data-theme');
    if(isDark) html.setAttribute('data-theme', 'light');
    else html.removeAttribute('data-theme');
  },
  openImport: () => document.getElementById('modalImport').classList.remove('hidden'),
  closeModals: () => document.querySelectorAll('[id^="modal"]').forEach(m => m.classList.add('hidden')),
  showLoader: (v) => document.getElementById('loader').classList.toggle('hidden', !v),
  handleError: (e) => { ui.showLoader(false); alert('Error: ' + e.message); }
};

window.onload = app.init;
</script>
