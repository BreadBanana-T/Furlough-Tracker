<script>
const app = {
  selectedDate: '',
  
  init: function() {
    const t = new Date();
    // Format YYYY-MM-DD local time
    const local = new Date(t.getTime() - (t.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
    document.getElementById('datePicker').value = local;
    app.load();
  },

  load: function() {
    this.selectedDate = document.getElementById('datePicker').value;
    if(!this.selectedDate) return;
    
    ui.showLoader(true);
    google.script.run
      .withSuccessHandler(this.renderHeatmap)
      .withFailureHandler(ui.handleError)
      .getHeatmapData(this.selectedDate);
  },

  renderHeatmap: function(data) {
    ui.showLoader(false);
    
    // 1. Sync Rotation UI
    if(data.rotation) document.getElementById('rotPicker').value = data.rotation;
    
    // 2. Render Grid
    const grid = document.getElementById('heatmapGrid');
    grid.innerHTML = '';
    
    let maxS=0, maxR=0;
    
    data.grid.forEach((b, i) => {
      // Stats
      if(b.net > maxS) maxS = b.net;
      if(b.net < maxR) maxR = b.net;

      // DOM
      const d = document.createElement('div');
      let cls = 'bg-neu';
      if(b.net > 0) cls = 'bg-pos';
      if(b.net < 0) cls = 'bg-neg';
      
      d.className = `cell ${cls}`;
      d.onclick = () => app.openSlot(b.index);
      d.innerHTML = `<span class="c-time">${b.label}</span><span class="c-val">${b.net>0?'+':''}${b.net}</span>`;
      
      grid.appendChild(d);
    });

    // 3. Update KPIs
    document.getElementById('kpi-surplus').innerText = '+' + maxS;
    document.getElementById('kpi-risk').innerText = maxR;

    // 4. Update Log
    const list = document.getElementById('furloughList');
    list.innerHTML = '';
    if (data.furloughs.length === 0) {
      list.innerHTML = '<li style="justify-content:center; color:#aaa;">No furloughs today</li>';
    } else {
      data.furloughs.forEach(f => {
        list.innerHTML += `
          <li>
            <span>${f.agent}</span> 
            <span>${f.time} <span class="badge">${f.rotation}</span></span>
          </li>`;
      });
    }
  },

  openSlot: function(idx) {
    ui.showLoader(true);
    google.script.run
      .withSuccessHandler(ui.showSlotModal)
      .getBucketDetails(this.selectedDate, idx);
  },
  
  submitFurlough: function(agentName, time) {
    if(!confirm(`Grant Early Release to ${agentName} starting at ${time}?`)) return;
    
    ui.showLoader(true);
    google.script.run
      .withSuccessHandler((res) => {
        if(res !== "Success") alert(res);
        ui.closeModals();
        app.load(); // Refresh to show impact
      })
      .submitFurlough(agentName, this.selectedDate, time);
  },

  setRotation: function() {
    const val = document.getElementById('rotPicker').value;
    google.script.run.setRotation(val);
  },

  showStats: function() {
    ui.showLoader(true);
    google.script.run.withSuccessHandler(stats => {
       ui.showLoader(false);
       alert(`
         Report Summary:
         Total Furloughs: ${stats.total}
         
         By Rotation:
         Week A: ${stats.byRot['Week A'] || 0}
         Week B: ${stats.byRot['Week B'] || 0}
         
         This Week: ${stats.thisWeek}
         This Month: ${stats.thisMonth}
       `);
    }).getStatsReport();
  },

  archive: function() {
    if(!confirm("Archive data older than 30 days to Drive?")) return;
    ui.showLoader(true);
    google.script.run.withSuccessHandler(msg => {
      ui.showLoader(false);
      alert(msg);
      app.load();
    }).archiveOldData();
  },

  runImport: function() {
    const s = document.getElementById('txtSched').value;
    const i = document.getElementById('txtIDP').value;
    ui.showLoader(true);
    
    google.script.run
      .withSuccessHandler(res => {
        alert(res);
        ui.closeModals();
        ui.showLoader(false);
        app.load();
      })
      .withFailureHandler(ui.handleError)
      .importRawData(s, i);
  }
};

const ui = {
  openImport: () => {
    document.getElementById('overlay').style.display='block';
    document.getElementById('modalImport').style.display='block';
  },
  
  showSlotModal: (data) => {
    ui.showLoader(false);
    document.getElementById('slotTitle').innerText = `${data.time} - Staffing Details`;
    
    const tbody = document.getElementById('agentList');
    tbody.innerHTML = '';
    
    if(data.agents.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#aaa;">No agents scheduled</td></tr>';
    } else {
      data.agents.forEach(a => {
         const tr = document.createElement('tr');
         tr.innerHTML = `
           <td>${a.name}</td>
           <td>${a.activity}</td>
           <td>${a.shiftStart} - ${a.shiftEnd}</td>
           <td><button class="btn-sm" onclick="app.submitFurlough('${a.name}', '${data.time}')">Early Release</button></td>
         `;
         tbody.appendChild(tr);
      });
    }

    document.getElementById('overlay').style.display='block';
    document.getElementById('modalSlot').style.display='block';
  },

  closeModals: () => {
    document.querySelectorAll('.modal').forEach(m => m.style.display='none');
    document.getElementById('overlay').style.display='none';
  },
  
  showLoader: (vis) => {
    document.getElementById('loader').style.display = vis ? 'flex' : 'none';
  },
  
  handleError: (e) => {
    ui.showLoader(false);
    alert('Error: ' + e.message);
  }
};

window.onload = app.init;
</script>
