<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Style'); ?>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <h1>WFM Command Center</h1>
    </div>
    <div class="actions">
      <select id="rotPicker" onchange="app.setRotation()">
        <option value="Week A">Week A</option>
        <option value="Week B">Week B</option>
      </select>
      
      <div style="width:1px; height:20px; background:rgba(255,255,255,0.2); margin:0 5px;"></div>
      
      <button class="btn-sec" onclick="ui.openImport()">Feed Data</button>
      <button class="btn-sec" onclick="app.showStats()">Reports</button>
      <input type="date" id="datePicker" onchange="app.load()">
      <button class="btn-pri" onclick="app.load()">Refresh</button>
    </div>
  </header>

  <main>
    <section class="card heatmap-section">
      <div class="card-head">
        <h2>Intraday Net Staffing</h2>
        <div class="legend">
          <span class="dot pos"></span> Surplus
          <span class="dot neg"></span> Risk
        </div>
      </div>
      <div id="heatmapGrid" class="grid">
        </div>
    </section>

    <aside class="sidebar">
      <div class="kpi-row">
        <div class="card kpi-box">
          <div class="kpi-val pos" id="kpi-surplus">--</div>
          <small>Max Surplus</small>
        </div>
        <div class="card kpi-box">
          <div class="kpi-val neg" id="kpi-risk">--</div>
          <small>Max Risk</small>
        </div>
      </div>

      <div class="card log-box">
        <div class="card-head">
           <h3>Furlough Log</h3>
           <button class="btn-sm" style="background:transparent; border:1px solid #ffffff30; color:white;" onclick="app.archive()">Archive</button>
        </div>
        <ul id="furloughList" class="log-list">
          <li style="justify-content:center; color:#ffffff50;">Loading...</li>
        </ul>
      </div>
    </aside>
  </main>
</div>

<div id="modalImport" class="modal">
  <div class="modal-content">
    <h2>Feed Data</h2>
    <p style="font-size:0.9rem; color:#aaa;">Paste content from your CSV exports.</p>
    
    <label>Schedule Data:</label>
    <textarea id="txtSched" placeholder="Paste Schedule CSV..."></textarea>
    
    <label style="margin-top:10px; display:block;">IDP/Requirements Data:</label>
    <textarea id="txtIDP" placeholder="Paste IDP CSV..."></textarea>
    
    <div style="margin-top:20px; text-align:right;">
      <button onclick="ui.closeModals()">Cancel</button>
      <button class="btn-pri" onclick="app.runImport()">Process</button>
    </div>
  </div>
</div>

<div id="modalSlot" class="modal" style="width: 600px;">
  <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
    <h2 id="slotTitle">Details</h2>
    <button onclick="ui.closeModals()" style="background:none; border:none; color:white; font-size:1.5rem;">&times;</button>
  </div>
  <div style="max-height:400px; overflow-y:auto;">
    <table class="agent-table">
      <thead><tr><th>Agent</th><th>Activity</th><th>Shift</th><th>Action</th></tr></thead>
      <tbody id="agentList"></tbody>
    </table>
  </div>
</div>

<div id="overlay" class="overlay" onclick="ui.closeModals()"></div>
<div id="loader" class="loader"><div class="spinner"></div><span>Processing...</span></div>

<?!= include('JavaScript'); ?>
</body>
</html>
